<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", "Microsoft YaHei UI", "Segoe UI Emoji", sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      cursor: default;
    }

    .pad { padding: 12px 14px 14px 12px; height: 100%; box-sizing: border-box; }

    .card {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 100%;
      padding: 12px 14px;
      box-sizing: border-box;
      border-radius: 14px;
      background: linear-gradient(180deg, #1E1E26 0%, #141419 100%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 20px 44px -20px rgba(0, 0, 0, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      animation: slideIn 0.24s cubic-bezier(0.2, 0.75, 0.3, 1);
      cursor: pointer;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }

    .card.out {
      animation: slideOut 0.26s ease forwards;
    }

    @keyframes slideOut {
      to { opacity: 0; transform: translateY(6px) scale(0.985); }
    }

    .icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 11px;
      overflow: hidden;
      background: #0E0E12;
      box-shadow: 0 6px 16px -8px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.07) inset;
    }

    .icon img { width: 100%; height: 100%; display: block; }

    .text { min-width: 0; flex: 1; }

    .line1 {
      font-size: 13px;
      color: #EDEAE3;
      letter-spacing: 0.2px;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .line1 b { font-weight: 600; }

    .line2 {
      font-size: 12px;
      line-height: 1.2;
      color: #F2CE8C;
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.92;
    }

    .close {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      align-self: flex-start;
      margin: -2px -4px 0 0;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #6E6E7A;
      font-size: 14px;
      line-height: 22px;
      text-align: center;
      cursor: pointer;
      transition: background 0.14s, color 0.14s;
    }

    .close:hover { background: rgba(255, 255, 255, 0.1); color: #EDEAE3; }
  </style>
</head>
<body>
  <div class="pad">
    <div class="card" id="card" title="点击回到启动器">
      <div class="icon"><img src="../../assets/app-icon-256.png" alt="" /></div>
      <div class="text">
        <div class="line1"><b>zcyGal</b> 已最小化到托盘</div>
        <div class="line2">Ciallo～(∠・ω&lt; )⌒★</div>
      </div>
      <button class="close" id="close" title="关闭">✕</button>
    </div>
  </div>

  <script>
    const card = document.getElementById('card');
    let closing = false;

    function dismiss(restore) {
      if (closing) return;
      closing = true;
      card.classList.add('out');
      setTimeout(() => {
        if (restore) window.notice.restore();
        else window.notice.close();
      }, 200);
    }

    document.getElementById('close').addEventListener('click', (e) => {
      e.stopPropagation();
      dismiss(false);
    });

    card.addEventListener('click', () => dismiss(true));

    // 5 秒后自动收起
    setTimeout(() => dismiss(false), 5000);
  </script>
</body>
</html>
